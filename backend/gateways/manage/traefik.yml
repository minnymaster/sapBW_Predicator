# =============================================================================
# Manage API Gateway — статическая конфигурация Traefik v3
# Домен: Manage API (UC-07 вопросы, UC-08 тесты, UC-11 назначения, аутентификация)
# Характер нагрузки: частые записи, только роль HR (кроме /v1/auth)
# NFR-09: полный audit trail модифицирующих запросов
# =============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: json

# ---------------------------------------------------------------------------
# Access Log — все запросы в JSON
# Модифицирующие запросы отличаются RouterName=manage-write@file
# Фильтрация в контейнере manage-audit-log:
#   jq 'select(.RouterName | test("write"))' manage-access.log >> manage-audit.log
# ---------------------------------------------------------------------------
accessLog:
  filePath: "/var/log/traefik/manage-access.log"
  format: json
  bufferingSize: 100
  fields:
    defaultMode: keep
    names:
      StartUTC:       drop
      RetryAttempts:  drop
    headers:
      defaultMode: drop
      names:
        Authorization:   redact     # токен не пишем
        X-User-ID:       keep       # идентификатор субъекта операции
        X-User-Role:     keep       # hr | director
        X-Audit:         keep       # маркер записи/удаления
        X-Real-IP:       keep
        Content-Type:    keep
        Content-Length:  keep

api:
  dashboard: false
  insecure: false

# ---------------------------------------------------------------------------
# Entry Points
# ---------------------------------------------------------------------------
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        options: modern

# ---------------------------------------------------------------------------
# Provider: файловая конфигурация (dynamic/)
# ---------------------------------------------------------------------------
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

# ---------------------------------------------------------------------------
# TLS 1.3 only (NFR-02)
# ---------------------------------------------------------------------------
tls:
  options:
    modern:
      minVersion: VersionTLS13
      sniStrict: true
      cipherSuites:
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
