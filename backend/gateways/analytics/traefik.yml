# =============================================================================
# Analytics API Gateway — статическая конфигурация Traefik v3
# Домен: Dashboard API (UC-13, Director) + Reports API (UC-13–UC-14, HR+Director)
# Характер нагрузки: тяжёлые агрегации, кэш GET 5–30 мин, Circuit Breaker
# Порты: :8280 HTTP → :8643 HTTPS
# =============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO
  format: json

accessLog:
  format: json
  fields:
    defaultMode: keep
    names:
      StartUTC:       drop
      RetryAttempts:  drop
    headers:
      defaultMode: drop
      names:
        Authorization:   redact
        X-User-ID:       keep
        X-User-Role:     keep
        X-Cache-Status:  keep    # HIT/MISS/BYPASS из Nginx — видно в логах Traefik
        X-Real-IP:       keep

api:
  dashboard: false
  insecure: false

# ---------------------------------------------------------------------------
# Entry Points
# ---------------------------------------------------------------------------
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        options: modern

# ---------------------------------------------------------------------------
# Provider: файловая конфигурация (dynamic/)
# ---------------------------------------------------------------------------
providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

# ---------------------------------------------------------------------------
# TLS 1.3 only (NFR-02)
# ---------------------------------------------------------------------------
tls:
  options:
    modern:
      minVersion: VersionTLS13
      sniStrict: true
      cipherSuites:
        - TLS_AES_128_GCM_SHA256
        - TLS_AES_256_GCM_SHA384
        - TLS_CHACHA20_POLY1305_SHA256
