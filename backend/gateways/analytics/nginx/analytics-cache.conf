# =============================================================================
# Analytics Cache — Nginx reverse proxy с двухуровневым кэшем
#
# /v1/dashboard/ → кэш 5 мин  → dashboard-api:3005 (KPI, живые метрики)
# /v1/reports/   → кэш 30 мин → reports-api:3004   (агрегированные отчёты)
#
# Кэшируются только GET/HEAD. POST/PUT/DELETE — без кэша (сквозной проксинг).
# proxy_cache_use_stale — при недоступности бэкенда отдаёт устаревший кэш,
#   что даёт буфер до срабатывания Circuit Breaker в Traefik.
# =============================================================================

# --- Dashboard cache zone -----------------------------------------------
# keys_zone=dash_cache:5m  — 5 MiB памяти для индекса (≈40 000 ключей)
# max_size=200m            — 200 MiB на диске для тел ответов
# inactive=10m             — запись вытесняется, если не запрашивалась 10 мин
proxy_cache_path /var/cache/nginx/dashboard
    levels=1:2
    keys_zone=dash_cache:5m
    max_size=200m
    inactive=10m
    use_temp_path=off;

# --- Reports cache zone -------------------------------------------------
# keys_zone=rep_cache:10m  — 10 MiB памяти (тяжёлые ключи с query params)
# max_size=1g              — до 1 GiB для тел больших отчётов
# inactive=35m             — чуть больше TTL 30 мин, чтобы не вытеснять сразу
proxy_cache_path /var/cache/nginx/reports
    levels=1:2
    keys_zone=rep_cache:10m
    max_size=1g
    inactive=35m
    use_temp_path=off;

server {
    listen 80;

    # Общие настройки проксирования
    proxy_http_version       1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Пробрасываем X-User-ID и X-User-Role, выставленные forwardAuth Traefik
    proxy_pass_request_headers on;

    # Таймауты — аналитика может быть медленной
    proxy_connect_timeout    5s;
    proxy_send_timeout       15s;

    # -------------------------------------------------------------------------
    # /v1/dashboard/ → dashboard-api:3005  (TTL кэша: 5 минут)
    # -------------------------------------------------------------------------
    location /v1/dashboard/ {
        # Кэш только GET/HEAD; POST проходит насквозь
        proxy_cache            dash_cache;
        proxy_cache_methods    GET HEAD;
        proxy_cache_valid      200 5m;
        proxy_cache_valid       404 30s;
        proxy_cache_valid       any 0;

        # Ключ не включает Authorization — дашборды агрегированные, общие для роли
        proxy_cache_key        "$request_method$host$uri$is_args$args";

        # Клиент может форсировать обновление через Pragma: no-cache
        proxy_cache_bypass     $http_pragma;
        proxy_no_cache         $http_pragma;

        # Отдавать устаревший кэш при ошибках бэкенда (буфер до срабатывания CB)
        proxy_cache_use_stale  error timeout updating
                               http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;   # фоновое обновление без блокировки
        proxy_cache_lock       on;           # один upstream-запрос при cache miss

        add_header X-Cache-Status  $upstream_cache_status always;
        add_header X-Cache-TTL     "300"                  always;

        proxy_read_timeout  30s;
        proxy_pass          http://dashboard-api:3005;
    }

    # -------------------------------------------------------------------------
    # /v1/reports/ → reports-api:3004  (TTL кэша: 30 минут)
    # -------------------------------------------------------------------------
    location /v1/reports/ {
        proxy_cache            rep_cache;
        proxy_cache_methods    GET HEAD;
        proxy_cache_valid      200 30m;
        proxy_cache_valid       404 1m;
        proxy_cache_valid       any 0;

        proxy_cache_key        "$request_method$host$uri$is_args$args";

        proxy_cache_bypass     $http_pragma;
        proxy_no_cache         $http_pragma;

        proxy_cache_use_stale  error timeout updating
                               http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock       on;

        add_header X-Cache-Status  $upstream_cache_status always;
        add_header X-Cache-TTL     "1800"                 always;

        # Отчёты могут быть тяжёлыми SQL-агрегациями
        proxy_read_timeout  120s;
        proxy_pass          http://reports-api:3004;
    }

    # Healthcheck — Traefik health-check probe не должна ломать маршрутизацию
    location /health {
        access_log  off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
