services:

  # ---------------------------------------------------------------------------
  # company_db — сотрудники, KPI, назначения (Manage API, Reports API)
  # ---------------------------------------------------------------------------
  company_db:
    image: postgres:16-alpine
    container_name: sapbw_company_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       company_db
      POSTGRES_USER:     company_user
      POSTGRES_PASSWORD: company_pass
    ports:
      - "5432:5432"
    volumes:
      - company_db_data:/var/lib/postgresql/data
      - ./postgres/company_db/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_user -d company_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sapbw_net

  # ---------------------------------------------------------------------------
  # courses_db — библиотека курсов и материалов (Courses API)
  # ---------------------------------------------------------------------------
  courses_db:
    image: postgres:16-alpine
    container_name: sapbw_courses_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       courses_db
      POSTGRES_USER:     courses_user
      POSTGRES_PASSWORD: courses_pass
    ports:
      - "5433:5432"
    volumes:
      - courses_db_data:/var/lib/postgresql/data
      - ./postgres/courses_db/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courses_user -d courses_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sapbw_net

  # ---------------------------------------------------------------------------
  # certification_db — вопросы, попытки, результаты (Tests API)
  # ---------------------------------------------------------------------------
  certification_db:
    image: postgres:16-alpine
    container_name: sapbw_certification_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       certification_db
      POSTGRES_USER:     certification_user
      POSTGRES_PASSWORD: certification_pass
    ports:
      - "5434:5432"
    volumes:
      - certification_db_data:/var/lib/postgresql/data
      - ./postgres/certification_db/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certification_user -d certification_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sapbw_net

  # ---------------------------------------------------------------------------
  # redis — кэш и Pub/Sub для manage-api, dashboard-api
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: sapbw_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sapbw_net

  # ---------------------------------------------------------------------------
  # dashboard-api — NestJS, UC-13 (Director SPA, async tasks, Redis cache)
  # ---------------------------------------------------------------------------
  dashboard-api:
    build:
      context: ../backend/services/dashboard-api
      dockerfile: Dockerfile
    container_name: sapbw_dashboard_api
    restart: unless-stopped
    environment:
      PORT: 3005
      NODE_ENV: production
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REPORTS_API_URL: "http://reports-api:3004"
      TESTS_API_URL: "http://tests-api:3001"
      HTTP_TIMEOUT_MS: 10000
    ports:
      - "3005:3005"
    depends_on:
      redis:
        condition: service_healthy
      reports-api:
        condition: service_started
    networks:
      - sapbw_net

  # ---------------------------------------------------------------------------
  # reports-api — NestJS, UC-13, UC-14 (аналитика и экспорт)
  # ---------------------------------------------------------------------------
  reports-api:
    build:
      context: ../backend/services/reports-api
      dockerfile: Dockerfile
    container_name: sapbw_reports_api
    restart: unless-stopped
    environment:
      COMPANY_DATABASE_URL: "postgresql://company_user:company_pass@company_db:5432/company_db?schema=public"
      CERTIFICATION_DATABASE_URL: "postgresql://certification_user:certification_pass@certification_db:5432/certification_db?schema=public"
      PORT: 3004
      NODE_ENV: production
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
    ports:
      - "3004:3004"
    depends_on:
      company_db:
        condition: service_healthy
      certification_db:
        condition: service_healthy
    networks:
      - sapbw_net

  # ---------------------------------------------------------------------------
  # tests-api — NestJS, UC-01–UC-03, UC-05
  # ---------------------------------------------------------------------------
  tests-api:
    build:
      context: ../backend/services/tests-api
      dockerfile: Dockerfile
    container_name: sapbw_tests_api
    restart: unless-stopped
    environment:
      CERTIFICATION_DATABASE_URL: "postgresql://certification_user:certification_pass@certification_db:5432/certification_db?schema=public"
      PORT: 3001
      NODE_ENV: production
      JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY}"
      LLM_PROVIDER: "${LLM_PROVIDER:-groq}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.groq.com/openai/v1}"
      LLM_API_KEY: "${LLM_API_KEY}"
      LLM_MODEL: "${LLM_MODEL:-llama-3.1-70b-versatile}"
    ports:
      - "3001:3001"
    depends_on:
      certification_db:
        condition: service_healthy
    networks:
      - sapbw_net

volumes:
  company_db_data:
  courses_db_data:
  certification_db_data:

networks:
  sapbw_net:
    driver: bridge
